<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Usuário</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/login.css">
</head>

<body class="d-flex justify-content-center align-items-center" style="height: 100vh; background-color:#0f172a;">

<div class="col-md-4">
    <div class="card p-4 shadow-lg" style="background-color: #1e293b; border-radius: 12px;">

        <h3 class="text-center mb-3" style="color:#38bdf8;">Criar Conta</h3>

        {% if erro %}
        <div class="alert alert-danger text-center">{{ erro }}</div>
        {% endif %}

        <form method="POST" action="/register">

            <input class="form-control mb-3" type="text" name="usuario" placeholder="Usuário" required>

            <input class="form-control mb-3" type="password" name="senha" placeholder="Senha" required>

            <input class="form-control mb-3" type="password" name="confirmar" placeholder="Confirmar senha" required>

            <!-- SELEÇÃO DE TIPO DE USUÁRIO -->
            <select class="form-select mb-3" name="tipo" required>
                <option value="user">Usuário comum</option>
                <option value="admin">Administrador</option>
            </select>

            <button class="btn w-100" style="background:#38bdf8; color:#0f172a; font-weight:bold;">
                Cadastrar
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="/login" style="color:#38bdf8; text-decoration:none;">Já possui conta? Entrar</a>
        </div>

    </div>
</div>

</body>
</html>
