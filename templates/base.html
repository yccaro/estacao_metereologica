<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema - Estação Meteorológica</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- CSS Global -->
    <link rel="stylesheet" href="/static/css/base.css">

    {% block css %}{% endblock %}
</head>

<body style="background-color:#0f172a; color:#e2e8f0;">

    <!-- ===================== NAVBAR ===================== -->
    <nav class="navbar navbar-expand-lg" 
         style="background-color:#0d1628; border-bottom:2px solid #38bdf8;">
        <div class="container-fluid">

            <a class="navbar-brand text-info fw-bold" href="/painel">
                Estação Meteorológica
            </a>

            <button class="navbar-toggler bg-info" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link text-info" href="/painel">Painel</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-info" href="/usuarios">Usuários</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-danger fw-bold" href="/logout">Sair</a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>
    <!-- ================= FIM NAVBAR ===================== -->


    <!-- ===================== CONTEÚDO ===================== -->
    <main class="container mt-4">
        {% block content %}
        {% endblock %}
    </main>
    <!-- ==================================================== -->


    <!-- ===================== FOOTER ===================== -->
    <footer class="text-center py-3 mt-4" 
            style="background-color:#0d1628; border-top:2px solid #38bdf8;">
        <p class="text-info mb-0">
            Estação Meteorológica © {{ now().year if now else "2025" }}
        </p>
    </footer>
    <!-- ==================================================== -->


    <!-- Bootstrap Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
