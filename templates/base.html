<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>{{ title if title else "Sistema de Sensores" }}</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    {% block css %}{% endblock %}
</head>
<body>

{% if session.get("usuario") %}
<nav class="navbar navbar-expand-lg mb-4">
    <div class="container-fluid">
        <a class="navbar-brand text-info fw-bold">Estação metereológica</a>

        <div>
            <a href="/painel" class="nav-link d-inline">Painel </a>
            <a href="/usuarios" class="nav-link d-inline">Usuários </a>
            <a href="/logout" class="nav-link d-inline text-danger">Sair </a>
        </div>
    </div>
</nav>
{% endif %}

<div class="container">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
